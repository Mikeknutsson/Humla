name: Hub import integration verification

on:
  pull_request:
    paths:
      - 'src/lib/hub/import-reuse-contract.*'
      - 'src/app/api/kpi/import/route.ts'
      - 'tests/import-reuse-contract.test.mjs'
      - '.github/workflows/hub-import-verification.yml'
  workflow_dispatch:

jobs:
  hub-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Hub import contract regression tests
        run: node --test tests/import-reuse-contract.test.mjs
      - name: TypeScript integration check
        run: npx tsc --noEmit
      - name: Production build smoke test
        run: npm run build
